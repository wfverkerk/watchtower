name: Supabase keep-alive

# Sends one small read to the database on Sunday and Wednesday so the free Supabase project is not paused for inactivity.
on:
  schedule:
    - cron: '0 9 * * 0'
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Query the Zoebas team catalog
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in GitHub Actions variables."
            exit 1
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $VITE_SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/zoebas_teams?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive query failed with HTTP $status"
            exit 1
          fi
